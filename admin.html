<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V8 Firebase</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:10px}.card{background:#222;padding:14px;border-radius:12px;margin-bottom:12px}.user{border:1px solid #333;padding:10px;border-radius:8px;margin:6px 0;font-size:12px;background:#1a1a1a}</style></head><body>
<h2>👑 Admin V8 Firebase - All Phones</h2>
<div class="card">WA: <input id="wa" value="256795143386"><button onclick="localStorage.setItem('ezol_wa',document.getElementById('wa').value);alert('Saved')">Save</button></div>
<div class="card"><h3>Users <span id="cnt">0</span></h3><button onclick="load()" style="padding:8px;background:#22c55e;border:none;border-radius:6px">🔄 Refresh All Phones</button><div id="list"></div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyD-XXXX-REPLACE-ME", authDomain: "ezol-wallet.firebaseapp.com", projectId: "ezol-wallet", storageBucket: "ezol-wallet.appspot.com", messagingSenderId: "123456789", appId: "1:123456789:web:abcdef" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
async function load(){
 let snap=await db.collection('users').get(); document.getElementById('cnt').innerText=snap.size;
 document.getElementById('list').innerHTML='';
 snap.forEach(d=>{let u=d.data(); document.getElementById('list').innerHTML+=`<div class="user">📱 ${u.phone} | ${u.name}<br>🔑 ${u.pass} | 💰 ${u.balance} UGX | Refs:${u.refs} | Tasks:${(u.done||[]).length}/6<br><button onclick="addBal('${u.phone}',500)" style="background:#f59e0b;border:none;padding:4px 8px;border-radius:4px">+500</button> <button onclick="reset('${u.phone}')" style="background:#3b82f6;color:#fff;border:none;padding:4px 8px;border-radius:4px">Reset Pass</button></div>`});
}
async function addBal(p,a){await db.collection('users').doc(p).update({balance:firebase.firestore.FieldValue.increment(a)}); load();}
async function reset(p){let np=prompt('New pass for '+p); if(!np) return; await db.collection('users').doc(p).update({pass:np}); load();}
document.getElementById('wa').value=localStorage.getItem('ezol_wa')||'256795143386'; load();
</script></body></html>
