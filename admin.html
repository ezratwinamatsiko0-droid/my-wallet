<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ezol CEO Dashboard</title><style>body{font-family:Arial;background:#f1f5f9;margin:0;padding:10px}.card{background:white;padding:16px;border-radius:16px;max-width:600px;margin:12px auto;box-shadow:0 4px 15px rgba(0,0,0,0.08)}input{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:10px 14px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:4px 2px}.stat{display:flex;justify-content:space-around;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:14px;border-radius:14px;margin-bottom:12px;text-align:center}.user{background:#f8fafc;border:1px solid #e2e8f0;padding:10px;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.task{background:#fff;border:1px solid #e2e8f0;padding:10px;margin:6px 0;border-radius:10px;font-size:13px}</style></head><body><div class="card"><h2 style="margin:0">💼 Ezol CEO Dashboard</h2><small style="color:gray">ezratwinamatsiko0-droid.github.io/my-wallet</small><div class="stat"><div><h3 id="totalUsers" style="margin:0">0</h3><small>Users</small></div><div><h3 id="totalBal" style="margin:0">0</h3><small>UGX To Pay</small></div><div><h3 id="totalTasks" style="margin:0">0</h3><small>Tasks</small></div></div><h3>⚙️ Settings</h3><input id="waNum" placeholder="Your WhatsApp 2567..."><button onclick="saveWA()">Save WhatsApp</button><small id="waShow" style="color:green"></small><h3 style="margin-top:18px">➕ Add Task</h3><input id="tTitle" placeholder="Title e.g. Follow TikTok"><input id="tLink" placeholder="Link https://..."><input id="tReward" type="number" placeholder="Reward UGX e.g. 1000"><button onclick="addTask()" style="background:#22c55e;width:100%">Add Task</button><h3 style="margin-top:18px">📋 Tasks (Live)</h3><div id="taskList"></div><h3 style="margin-top:18px">👥 All Users & Balances</h3><div style="display:flex;gap:5px"><button onclick="loadUsers()" style="background:#0f172a">🔄 Refresh Users</button><button onclick="exportUsers()" style="background:#f59e0b">📤 Export</button><button onclick="clearAll()" style="background:#ef4444">🗑️ Reset All</button></div><div id="userList" style="margin-top:10px"></div><p style="text-align:center;font-size:11px;margin-top:15px"><a href="index.html">→ Open Wallet</a> | Ezol Admin</p></div><script>function getUsers(){return JSON.parse(localStorage.getItem('ezol_users')||'{}')}function saveUsers(u){localStorage.setItem('ezol_users',JSON.stringify(u))}function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function saveTasks(t){localStorage.setItem('ezol_tasks',JSON.stringify(t))}function getWa(){return localStorage.getItem('ezol_wa')||''}function saveWA(){let n=waNum.value.trim();if(!n)return alert('Enter 256...');localStorage.setItem('ezol_wa',n);waShow.innerText='✅ Saved: '+n}function addTask(){let title=tTitle.value.trim(),link=tLink.value.trim(),reward=parseInt(tReward.value);if(!title||!reward)return alert('Title & reward');let tasks=getTasks();tasks.push({id:Date.now(),title,link,reward});saveTasks(tasks);tTitle.value='';tLink.value='';tReward.value='';loadTasks();alert('Task added!')}function loadTasks(){let tasks=getTasks();taskList.innerHTML='';tasks.forEach(t=>{taskList.innerHTML+=`<div class="task"><b>${t.title}</b> - <span style="color:green">${t.reward} UGX</span><br><small style="color:#2563eb">${t.link||'No link'}</small><br><button onclick="delTask(${t.id})" style="background:#ef4444;padding:4px 8px;font-size:11px;margin-top:4px">Delete</button></div>`});totalTasks.innerText=tasks.length}function delTask(id){if(!confirm('Delete?'))return;let tasks=getTasks().filter(t=>t.id!=id);saveTasks(tasks);loadTasks()}function loadUsers(){let users=getUsers();let html='';let total=0;let count=Object.keys(users).length;for(let phone in users){let u=users[phone];total+=u.balance||0;let refBy=u.refBy||'-';html+=`<div class="user"><div><b>${phone}</b><br><small>Bal: <span style="color:green;font-weight:800">UGX ${u.balance||0}</span> | Ref: ${refBy}</small><br><small style="color:gray">Pass: ${u.password}</small></div><div><button onclick="addBal('${phone}')" style="background:#22c55e;padding:5px 8px;font-size:11px">+$$</button><button onclick="delUser('${phone}')" style="background:#ef4444;padding:5px 8px;font-size:11px">X</button></div></div>`}if(!count)html='<p style="text-align:center;color:gray">No users yet on this device. Users data is saved on each user's phone browser.</p>';userList.innerHTML=html;totalUsers.innerText=count;totalBal.innerText=total.toLocaleString()}function addBal(phone){let amt=prompt('Add amount for '+phone+' (negative to deduct):');if(!amt)return;amt=parseInt(amt);let users=getUsers();users[phone].balance=(users[phone].balance||0)+amt;saveUsers(users);loadUsers()}function delUser(phone){if(!confirm('Delete user '+phone+'?'))return;let users=getUsers();delete users[phone];saveUsers(users);loadUsers()}function exportUsers(){let data=JSON.stringify(getUsers(),null,2);let blob=new Blob([data],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='ezol_users_'+new Date().toISOString().slice(0,10)+'.json';a.click()}function clearAll(){if(!confirm('RESET ALL USERS & TASKS? This cannot be undone!'))return;if(!confirm('Are you SURE? All balances lost'))return;localStorage.removeItem('ezol_users');localStorage.removeItem('ezol_tasks');loadUsers();loadTasks();alert('Reset done')}window.onload=()=>{waNum.value=getWa();waShow.innerText=getWa()?'Current: '+getWa():'';loadTasks();loadUsers()}</script></body></html>
