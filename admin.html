<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ezol CEO</title><style>body{font-family:Arial;background:#f1f5f9;margin:0;padding:10px}.card{background:#fff;padding:16px;border-radius:16px;max-width:600px;margin:12px auto}input{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:11px 14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700;margin:4px 2px}.stat{display:flex;justify-content:space-around;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:14px;border-radius:14px;text-align:center}.user{background:#f8fafc;border:1px solid #e2e8f0;padding:10px;margin:6px 0;border-radius:10px;font-size:13px}.task{background:#fff;border:1px solid #e2e8f0;padding:10px;margin:6px 0;border-radius:10px;font-size:13px;word-break:break-all}</style></head><body><div class="card"><h2>💼 Ezol CEO</h2><div class="stat"><div><h3 id="totalUsers" style="margin:0">0</h3><small>Users</small></div><div><h3 id="totalBal" style="margin:0">0</h3><small>UGX To Pay</small></div><div><h3 id="totalTasks" style="margin:0">0</h3><small>Tasks</small></div></div><h3>⚙️ Settings</h3><input id="waNum" placeholder="2567..."><button onclick="saveWA()">Save WhatsApp</button><div id="waShow" style="color:green;font-size:13px;margin:5px"></div><h3>➕ Add Task</h3><input id="tTitle" placeholder="Title e.g Follow TikTok"><input id="tLink" placeholder="Link ONLY e.g https://tiktok.com" type="url"><input id="tReward" type="number" placeholder="Reward 1000"><button onclick="addTask()" style="background:#22c55e;width:100%">Add Task</button><h3>📋 Tasks (Live)</h3><div id="taskList"></div><h3>👥 All Users & Balances</h3><button onclick="loadUsers()" style="background:#0f172a">🔄 Refresh</button><button onclick="exportUsers()" style="background:#f59e0b">📤 Export</button><button onclick="if(confirm('Reset ALL?')){localStorage.clear();location.reload()}" style="background:#ef4444">🗑️ Reset</button><div id="userList" style="margin-top:10px"></div><p style="text-align:center;font-size:12px"><a href="index.html">→ Open Wallet</a></p></div><script>function getUsers(){try{return JSON.parse(localStorage.getItem('ezol_users')||'{}')}catch(e){return{}}}function getTasks(){try{return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}catch(e){return[]}}function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function saveWA(){let n=document.getElementById('waNum').value.trim().replace(/\s/g,'');if(!n){alert('Enter number');return}localStorage.setItem('ezol_wa',n);document.getElementById('waShow').innerText='✅ Saved: '+n;alert('Saved!')}function addTask(){let title=document.getElementById('tTitle').value.trim();let link=document.getElementById('tLink').value.trim().split(' ')[0];let reward=parseInt(document.getElementById('tReward').value);if(!title){alert('Enter title');return}if(!reward){alert('Enter reward');return}let tasks=getTasks();tasks.push({id:Date.now(),title:title,link:link,reward:reward});localStorage.setItem('ezol_tasks',JSON.stringify(tasks));document.getElementById('tTitle').value='';document.getElementById('tLink').value='';document.getElementById('tReward').value='';loadTasks();alert('Task Added!')}function loadTasks(){let tasks=getTasks();let el=document.getElementById('taskList');el.innerHTML='';tasks.forEach(t=>{el.innerHTML+='<div class=task><b>'+esc(t.title)+'</b> - <span style=color:green>'+t.reward+' UGX</span><br><small>'+esc(t.link)+'</small><br><button onclick="delTask('+t.id+')" style=background:#ef4444;padding:4px 8px;font-size:11px>Delete</button></div>'});document.getElementById('totalTasks').innerText=tasks.length}function delTask(id){let tasks=getTasks().filter(t=>t.id!=id);localStorage.setItem('ezol_tasks',JSON.stringify(tasks));loadTasks()}function loadUsers(){let users=getUsers();let html='';let total=0;let count=Object.keys(users).length;for(let phone in users){let u=users[phone];total+=u.balance||0;html+='<div class=user><div><b>'+esc(phone)+'</b><br>Bal: <span style=color:green;font-weight:800>UGX '+(u.balance||0)+'</span> | Ref: '+esc(u.refBy||'-')+'<br><small>Pass: '+esc(u.password||'')+'</small></div><div><button onclick="addBal(\''+phone+'\')" style=background:#22c55e;padding:5px 8px;font-size:11px>+$$</button><button onclick="delUser(\''+phone+'\')" style=background:#ef4444;padding:5px 8px;font-size:11px>X</button></div></div>'}if(!count)html='<p style=color:gray;text-align:center>0 users on this phone. Login on wallet first, then Refresh.</p>';document.getElementById('userList').innerHTML=html;document.getElementById('totalUsers').innerText=count;document.getElementById('totalBal').innerText=total.toLocaleString()}function addBal(phone){let amt=prompt('Amount for '+phone);if(!amt)return;amt=parseInt(amt);let users=getUsers();users[phone].balance=(users[phone].balance||0)+amt;localStorage.setItem('ezol_users',JSON.stringify(users));loadUsers()}function delUser(phone){if(!confirm('Delete '+phone))return;let users=getUsers();delete users[phone];localStorage.setItem('ezol_users',JSON.stringify(users));loadUsers()}function exportUsers(){let data=JSON.stringify(getUsers(),null,2);let blob=new Blob([data],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='ezol_users.json';a.click()}window.onload=function(){let wa=localStorage.getItem('ezol_wa')||'';document.getElementById('waNum').value=wa;if(wa)document.getElementById('waShow').innerText='Current: '+wa;loadTasks();loadUsers()}</script></body></html>
