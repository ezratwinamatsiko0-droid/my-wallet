<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ezol CEO Admin V5 - Password</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:10px;margin:0}.card{background:#222;padding:14px;border-radius:12px;margin-bottom:12px}.btn{padding:8px 12px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}.user{border:1px solid #333;padding:10px;border-radius:8px;margin:6px 0;font-size:12px;background:#1a1a1a;line-height:1.6}</style></head><body>
<h2>👑 Ezol CEO Admin V5 - Password Manager</h2>
<div class="card">WhatsApp: <input id="waNum" value="256795143386" style="padding:6px;border-radius:6px;border:none;width:160px"><button onclick="saveWA()" class="btn" style="background:#22c55e">Save</button></div>

<div class="card"><h3>👥 Users (<span id="userCount">0</span>)</h3>
<button onclick="loadUsers()" class="btn" style="background:#22c55e">🔄 Refresh</button>
<button onclick="clearUsers()" class="btn" style="background:#ef4444">Clear All</button>
<input id="searchUser" placeholder="Search phone/name" oninput="loadUsers()" style="width:100%;padding:8px;border-radius:6px;border:none;margin-top:8px;background:#333;color:#fff">
<div id="userList" style="margin-top:10px"></div></div>

<div class="card" style="border:2px solid orange"><h3>📈 Investments</h3><button onclick="loadInvests()" class="btn" style="background:#22c55e">Refresh Invests</button><div id="investList" style="margin-top:10px"></div></div>

<script>
function saveWA(){ localStorage.setItem('ezol_wa',document.getElementById('waNum').value); alert('Saved!'); }
function loadUsers(){
 let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); let keys=Object.keys(users); let search=(document.getElementById('searchUser').value||'').toLowerCase();
 let filtered=keys.filter(p=>{ let u=users[p]; return p.includes(search) || (u.name||'').toLowerCase().includes(search); });
 document.getElementById('userCount').innerText=filtered.length+'/'+keys.length;
 if(filtered.length==0){ document.getElementById('userList').innerHTML='<p style="color:#888">No users. Share?ref=0783228690</p>'; return; }
 document.getElementById('userList').innerHTML=filtered.map(phone=>{
  let u=users[phone]; let done=JSON.parse(localStorage.getItem('ezol_done_'+phone)||'[]').length; let invests=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]').length;
  return `<div class="user">📱 <b>${phone}</b> | 👤 ${u.name||'No name'}<br>🔑 Pass: <b style="color:#fbbf24">${u.pass||'NO PASS (old user)'}</b> | 💰 <b style="color:#22c55e">${u.balance||0} UGX</b><br>👥 Refs: ${u.refs||0} | ✅ Tasks: ${done}/6 | 📈 Invests: ${invests}<br><small>Joined: ${u.joined?new Date(u.joined).toLocaleString():''}</small><br>
  <button onclick="addBal('${phone}')" class="btn" style="background:#f59e0b;margin-top:4px">+ Add Bal</button>
  <button onclick="resetPass('${phone}')" class="btn" style="background:#3b82f6;color:#fff;margin-left:4px">🔑 Reset Pass</button>
  <button onclick="copyLogin('${phone}')" class="btn" style="background:#a855f7;color:#fff;margin-left:4px">📋 Copy Login</button>
  <button onclick="delUser('${phone}')" class="btn" style="background:#ef4444;color:#fff;margin-left:4px">Delete</button></div>`;
 }).join('');
}
function addBal(phone){ let amt=prompt('Add amount to '+phone+':'); if(!amt) return; let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); users[phone].balance=(users[phone].balance||0)+parseInt(amt); localStorage.setItem('ezol_users',JSON.stringify(users)); loadUsers(); alert('Added '+amt+' to '+phone); }
function resetPass(phone){ let np=prompt('New password for '+phone+':'); if(!np) return; let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); users[phone].pass=np; localStorage.setItem('ezol_users',JSON.stringify(users)); loadUsers(); alert('Password reset! New pass: '+np+' - Send to user'); }
function copyLogin(phone){ let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); let u=users[phone]; let txt=`Ezol Wallet Login:\nPhone: ${phone}\nPass: ${u.pass}\nLink: https://ezratwinamatsiko0-droid.github.io/my-wallet/`; navigator.clipboard.writeText(txt).then(()=>alert('Copied login details!')); }
function delUser(phone){ if(!confirm('Delete '+phone+'?')) return; let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); delete users[phone]; localStorage.setItem('ezol_users',JSON.stringify(users)); localStorage.removeItem('ezol_done_'+phone); localStorage.removeItem('ezol_invests_'+phone); loadUsers(); }
function clearUsers(){ if(confirm('Clear ALL users? This deletes everyone!')){ localStorage.removeItem('ezol_users'); loadUsers(); } }
function loadInvests(){ let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); let html=''; Object.keys(users).forEach(phone=>{ let invs=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]'); invs.forEach((inv,i)=>{ html+=`<div class="user">${phone} - ${inv.plan} ${inv.invest}→${inv.return} - ${inv.status} <button onclick="markPaid('${phone}',${i})" class="btn" style="background:#22c55e">Paid</button></div>`; }); }); document.getElementById('investList').innerHTML=html||'No invests'; }
function markPaid(phone,i){ let invs=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]'); invs[i].status='Paid'; localStorage.setItem('ezol_invests_'+phone,JSON.stringify(invs)); let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); users[phone].balance+=invs[i].return; localStorage.setItem('ezol_users',JSON.stringify(users)); loadInvests(); loadUsers(); }
document.getElementById('waNum').value=localStorage.getItem('ezol_wa')||'256795143386'; loadUsers(); loadInvests();
</script></body></html>
