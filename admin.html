<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ezol Admin</title>
<style>body{font-family:system-ui;background:#f1f5f9;padding:15px} .card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px} table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:10px;border-bottom:1px solid #eee;text-align:left} th{background:#f8fafc} .btn{padding:6px 10px;border:none;border-radius:6px;color:#fff;cursor:pointer} .btn-green{background:#10b981} .btn-red{background:#ef4444} .btn-blue{background:#4f46e5} .stats{display:flex;gap:10px} .stat{flex:1;background:#fff;padding:15px;border-radius:12px;text-align:center}</style>
</head>
<body>
<h2>🔐 Ezol Admin - LIVE</h2>
<div class="stats"><div class="stat"><h3 id="totalUsers">0</h3><p>Users</p></div><div class="stat"><h3 id="totalWithdraw">0</h3><p>Withdraws</p></div><div class="stat"><h3 id="totalBal">0 UGX</h3><p>Total Bal</p></div></div>
<div class="card"><h3>👥 Users</h3><table><thead><tr><th>Phone</th><th>Name</th><th>Balance</th><th>Action</th></tr></thead><tbody id="usersTable"></tbody></table></div>
<div class="card"><h3>💸 Withdraw Requests</h3><table><thead><tr><th>Phone</th><th>Name</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="wdTable"></tbody></table></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB05b_o2tjLSXm4tuo-R6JULwFffy5eo",
  authDomain: "ezol-wallet.firebaseapp.com",
  projectId: "ezol-wallet",
  storageBucket: "ezol-wallet.firebasestorage.app",
  messagingSenderId: "33518327685",
  appId: "1:33518327685:web:a932ecbbba8501cd2c96ec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
onSnapshot(collection(db,"users"),snap=>{
 let total=0; let html='';
 snap.forEach(d=>{
  const u=d.data(); total+=u.balance||0;
  html+=`<tr><td>${u.phone}</td><td>${u.name}</td><td>${(u.balance||0).toLocaleString()}</td><td><button class="btn btn-green" onclick="addBal('${u.phone}',5000)">+5k</button> <button class="btn btn-blue" onclick="addBal('${u.phone}',20000)">+20k</button> <button class="btn btn-red" onclick="addBal('${u.phone}',-5000)">-5k</button></td></tr>`;
 });
 document.getElementById('usersTable').innerHTML=html;
 document.getElementById('totalUsers').innerText=snap.size;
 document.getElementById('totalBal').innerText=total.toLocaleString()+' UGX';
});
onSnapshot(query(collection(db,"withdrawals"),orderBy("createdAt","desc")),snap=>{
 let html='';
 snap.forEach(d=>{
  const w=d.data();
  html+=`<tr><td>${w.phone}</td><td>${w.name}</td><td>${w.amount} UGX</td><td>${w.status}</td><td>${w.status=='pending'?`<button class="btn btn-green" onclick="approve('${d.id}')">Approve</button>`:'Done'}</td></tr>`;
 });
 document.getElementById('wdTable').innerHTML=html;
 document.getElementById('totalWithdraw').innerText=snap.size;
});
window.addBal=async(phone,amt)=>{
 await updateDoc(doc(db,"users",phone),{balance:increment(amt)});
 alert(amt+' UGX for '+phone);
};
window.approve=async(id)=>{
 await updateDoc(doc(db,"withdrawals",id),{status:"approved"});
 alert('Approved!');
};
</script>
</body>
</html>
