<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ezol CEO Admin V3</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:12px} .card{background:#222;padding:12px;border-radius:12px;margin-bottom:12px} input,button{padding:10px;border-radius:8px;border:none} button{background:#22c55e;color:#fff;font-weight:800}</style></head><body>
<h2>👑 Ezol CEO Admin V3 - Invest & Withdraw</h2>
<div class="card">WhatsApp Number: <input id="waNum" value="256795143386" style="width:180px"><button onclick="saveWa()">Save</button> <p style="font-size:11px">All withdraw/invest go to this WhatsApp</p></div>
<div class="card"><h3>👥 Users</h3><button onclick="loadUsers()">🔄 Refresh Users</button><div id="users"></div></div>
<div class="card" style="border:2px solid #f59e0b"><h3>📈 Investments - Pending</h3><button onclick="loadInvests()">🔄 Refresh Invests</button><div id="invests"></div></div>
<div class="card"><h3>➕ Add Task</h3><input id="tTitle" placeholder="Title"><input id="tReward" placeholder="Reward e.g 500"><input id="tLink" placeholder="Link https://"><button onclick="addTask()">Add Task</button><div id="taskList"></div></div>
<script>
function saveWa(){localStorage.setItem('ezol_wa',document.getElementById('waNum').value);alert('Saved '+document.getElementById('waNum').value)}
function loadUsers(){
 let users=JSON.parse(localStorage.getItem('ezol_users')||'{}');
 let html=''; for(let p in users){html+=`<div style="border-bottom:1px solid #444;padding:6px">${p} - Bal: ${users[p].balance} UGX - Refs: ${users[p].refs||0} - Tasks: ${users[p].tasksDone.length} <button onclick="payUser('${p}')">Pay/Reset</button></div>`}
 document.getElementById('users').innerHTML=html||'No users';
}
function payUser(p){let amt=prompt('Enter amount paid to '+p+' or new balance'); if(amt===null) return; let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); users[p].balance=parseInt(amt); localStorage.setItem('ezol_users',JSON.stringify(users)); loadUsers();}
function loadInvests(){
 let users=JSON.parse(localStorage.getItem('ezol_users')||'{}'); let out='';
 for(let phone in users){let inv=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]'); inv.forEach((it,idx)=>{out+=`<div style="border:1px solid #555;padding:8px;margin:4px;border-radius:8px">${phone} - ${it.plan} ${it.invest}→${it.return} - ${it.status} - ${new Date(it.date).toLocaleDateString()} <button onclick="approveInvest('${phone}',${idx})" style="background:#f59e0b">Approve</button> <button onclick="completeInvest('${phone}',${idx})" style="background:#22c55e">Mark Paid</button></div>`})}
 document.getElementById('invests').innerHTML=out||'No invests';
}
function approveInvest(phone,idx){
 let inv=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]'); inv[idx].status='Active'; localStorage.setItem('ezol_invests_'+phone,JSON.stringify(inv)); alert('Approved! Remember to collect MoMo '+inv[idx].invest); loadInvests();
}
function completeInvest(phone,idx){
 let inv=JSON.parse(localStorage.getItem('ezol_invests_'+phone)||'[]'); let users=JSON.parse(localStorage.getItem('ezol_users')||'{}');
 let ret=inv[idx].return; users[phone].balance=(users[phone].balance||0)+ret; inv[idx].status='Paid '+ret;
 localStorage.setItem('ezol_users',JSON.stringify(users)); localStorage.setItem('ezol_invests_'+phone,JSON.stringify(inv)); alert('Paid '+ret+' to '+phone); loadInvests(); loadUsers();
}
function addTask(){let t=JSON.parse(localStorage.getItem('ezol_tasks')||'[]'); t.push({title:document.getElementById('tTitle').value,reward:parseInt(document.getElementById('tReward').value),link:document.getElementById('tLink').value}); localStorage.setItem('ezol_tasks',JSON.stringify(t)); alert('Task added'); showTasks();}
function showTasks(){let t=JSON.parse(localStorage.getItem('ezol_tasks')||'[]'); document.getElementById('taskList').innerHTML=t.map((x,i)=>`${i}: ${x.title} ${x.reward} <button onclick="delTask(${i})">Del</button>`).join('<br>')}
function delTask(i){let t=JSON.parse(localStorage.getItem('ezol_tasks')||'[]'); t.splice(i,1); localStorage.setItem('ezol_tasks',JSON.stringify(t)); showTasks();}
document.getElementById('waNum').value=localStorage.getItem('ezol_wa')||'256795143386'; loadUsers(); loadInvests(); showTasks();
</script></body></html>
