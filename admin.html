<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO Admin - Ezol</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:15px}.h{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:18px;border-radius:14px;text-align:center;margin-bottom:15px}.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:12px}.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:4px 4px 0 0}.green{background:#10b981;color:#fff}.red{background:#ef4444;color:#fff}.yellow{background:#f59e0b;color:#fff}.blue{background:#3b82f6;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding:10px 0;flex-wrap:wrap}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.box{background:#1e293b;padding:14px;border-radius:12px;text-align:center}input{padding:8px;border-radius:6px;border:none;width:100px;margin:4px}</style></head><body><div class="h"><h2>👑 CEO ADMIN v3 - BONUS</h2><p>MoMo: 0795143386 | Add Bonus Feature ON</p></div><div class="stat"><div class="box"><h3 id="totalUsers">0</h3><p>Users</p></div><div class="box"><h3 id="totalWith">0</h3><p>Withdraw Req</p></div><div class="box"><h3 id="totalVIP">0</h3><p>VIP Req</p></div><div class="box"><h3 id="totalBal">0</h3><p>UGX Owed</p></div></div><div class="card"><h3>💎 VIP Requests - 15k Each!</h3><div id="vipList">Loading...</div></div><div class="card"><h3>💸 Withdraw Requests</h3><div id="withList">Loading...</div></div><div class="card"><h3>👥 Recent Users - Add Bonus Here</h3><div id="userList">Loading...</div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,query,orderBy,limit,onSnapshot,doc,updateDoc,deleteDoc,getDocs,addDoc,serverTimestamp,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyB05b_o2tjLSXm4tuo-R6JULwFffy5eo",authDomain:"ezol-wallet.firebaseapp.com",projectId:"ezol-wallet",storageBucket:"ezol-wallet.firebasestorage.app",messagingSenderId:"33518327685",appId:"1:33518327685:web:a932ecbbba8501cd2c96ec"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);async function loadStats(){const u=await getDocs(collection(db,"users"));let bal=0;u.forEach(d=>{bal+=d.data().balance||0});document.getElementById('totalUsers').innerText=u.size;document.getElementById('totalBal').innerText=bal.toLocaleString();const w=await getDocs(collection(db,"withdrawals"));document.getElementById('totalWith').innerText=w.size;const v=await getDocs(collection(db,"vip_requests"));document.getElementById('totalVIP').innerText=v.size}loadStats();function vipLive(){const q=query(collection(db,"vip_requests"),orderBy("createdAt","desc"),limit(30));onSnapshot(q,snap=>{const el=document.getElementById('vipList');el.innerHTML='';if(snap.empty){el.innerHTML='<p style="color:#94a3b8">No VIP requests</p>';return}snap.forEach(d=>{const v=d.data();const id=d.id;el.innerHTML+=`<div class="row"><div><b>${v.phone}</b><br><small>TxID: ${v.txid} | ${v.status}</small></div><div><button class="btn green" onclick="approveVIP('${id}','${v.phone}')">Approve</button><button class="btn red" onclick="rejectVIP('${id}')">Reject</button></div></div>`})})}function withLive(){const q=query(collection(db,"withdrawals"),orderBy("createdAt","desc"),limit(30));onSnapshot(q,snap=>{const el=document.getElementById('withList');el.innerHTML='';if(snap.empty){el.innerHTML='<p style="color:#94a3b8">No withdraws</p>';return}snap.forEach(d=>{const v=d.data();const id=d.id;el.innerHTML+=`<div class="row"><div><b>${v.phone}</b> - ${v.name}<br><small>${v.amount} UGX | ${v.status}</small></div><div><a href="tel:*165*1*1*${v.phone}*${v.amount}%23" class="btn yellow">Pay</a><button class="btn green" onclick="doneWith('${id}','${v.phone}',${v.amount})">Done</button><button class="btn red" onclick="rejectWith('${id}')">X</button></div></div>`})})}function usersLive(){const q=query(collection(db,"users"),orderBy("createdAt","desc"),limit(30));onSnapshot(q,snap=>{const el=document.getElementById('userList');el.innerHTML='';snap.forEach(d=>{const v=d.data();const id=d.id;el.innerHTML+=`<div class="row"><div><b>${v.phone}</b> - ${v.name}<br><small>Bal: ${(v.balance||0).toLocaleString()} | Inv: ${v.invites||0} ${v.isVIP?'| VIP':''}</small></div><div><input id="bonus_${v.phone}" placeholder="Amount" type="number"><button class="btn blue" onclick="addBonus('${v.phone}')">+Bonus</button><button class="btn green" onclick="quickBonus('${v.phone}',1000)">+1k</button><button class="btn yellow" onclick="quickBonus('${v.phone}',5000)">+5k</button></div></div>`})})}window.approveVIP=async(id,phone)=>{if(!confirm('Approve VIP for '+phone+'?'))return;await updateDoc(doc(db,"vip_requests",id),{status:"approved"});await updateDoc(doc(db,"users",phone),{isVIP:true});await addDoc(collection(db,"proofs"),{phone:phone.slice(0,4)+'****'+phone.slice(-4),amount:15000,msg:"VIP upgrade PAID",createdAt:serverTimestamp()});alert('VIP Approved + Proof');loadStats()};window.rejectVIP=async(id)=>{await deleteDoc(doc(db,"vip_requests",id))};window.doneWith=async(id,phone,amount)=>{await updateDoc(doc(db,"withdrawals",id),{status:"paid"});await addDoc(collection(db,"proofs"),{phone:phone.slice(0,4)+'****'+phone.slice(-4),amount:amount,msg:"withdraw PAID",createdAt:serverTimestamp()});alert('PAID + Proof created');loadStats()};window.rejectWith=async(id)=>{await deleteDoc(doc(db,"withdrawals",id))};window.addBonus=async(phone)=>{const input=document.getElementById('bonus_'+phone);const amt=Number(input.value);if(!amt||amt<=0)return alert('Enter amount');await updateDoc(doc(db,"users",phone),{balance:increment(amt)});await addDoc(collection(db,"proofs"),{phone:phone.slice(0,4)+'****'+phone.slice(-4),amount:amt,msg:"bonus PAID - CEO gift",createdAt:serverTimestamp()});alert(amt+' UGX Bonus added to '+phone+' + LIVE proof!');input.value='';loadStats()};window.quickBonus=async(phone,amt)=>{await updateDoc(doc(db,"users",phone),{balance:increment(amt)});await addDoc(collection(db,"proofs"),{phone:phone.slice(0,4)+'****'+phone.slice(-4),amount:amt,msg:"bonus PAID",createdAt:serverTimestamp()});alert(amt+' UGX added to '+phone);loadStats()};vipLive();withLive();usersLive();</script></body></html>
