<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Ezol</title><style>body{font-family:Arial;padding:15px;background:#f5f7ff}.card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:6px}small{color:gray}</style></head><body><div class="card"><h2 style="text-align:center;color:#2563eb">Admin Panel 👑</h2><input id="title" placeholder="Task title e.g. Subscribe YouTube"><input id="link" placeholder="Task Link e.g. https://youtube.com/... (optional)"><input id="reward" type="number" placeholder="Reward UGX e.g. 1000"><button onclick="addTask()">Add Task</button><hr><h3>Withdraw Number</h3><input id="waNum" placeholder="Your WhatsApp e.g. 256771234567"><button onclick="saveWa()" style="background:#25D366">Save WhatsApp Number</button><small>Users will withdraw via this number</small><hr><h3>Live Tasks (<span id="count">0</span>)</h3><div id="list"></div><br><a href="index.html">→ Go to Wallet</a></div><script>function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function saveTasks(t){localStorage.setItem('ezol_tasks',JSON.stringify(t));show()}function addTask(){let t=title.value.trim(),l=link.value.trim(),r=reward.value.trim();if(!t||!r)return alert('Title & Reward needed');let a=getTasks();a.push({id:Date.now(),title:t,link:l,reward:parseInt(r)});saveTasks(a);title.value='';link.value='';reward.value='';}function del(id){if(!confirm('Delete?'))return;saveTasks(getTasks().filter(x=>x.id!=id))}function show(){let a=getTasks();count.innerText=a.length;list.innerHTML=a.map(x=>`<div style="background:#f1f5f9;padding:10px;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between"><div><b>${x.title}</b><br><small>${x.reward} UGX ${x.link?'| 🔗 link':''}</small></div><span onclick="del(${x.id})" style="color:red;cursor:pointer">❌</span></div>`).join('')||'No tasks yet'}function saveWa(){let n=waNum.value.trim();if(!n)return alert('Enter number');localStorage.setItem('ezol_wa',n);alert('Saved! '+n)}waNum.value=localStorage.getItem('ezol_wa')||'';show()</script></body></html>
