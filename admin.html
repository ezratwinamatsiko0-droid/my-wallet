<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:blue;color:white;border:none;border-radius:8px;font-weight:bold}</style></head><body><div class="card"><h2 style="color:blue;text-align:center">Admin Panel - Ezol</h2><input id="title" placeholder="Task e.g. Watch video"><input id="reward" type="number" placeholder="Reward e.g. 500"><button onclick="addTask()">Add Task</button><h3>Tasks:</h3><div id="list"></div><br><a href="index.html">Go to Wallet</a></div><script>function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function saveTasks(t){localStorage.setItem('ezol_tasks',JSON.stringify(t));show()}function addTask(){let t=title.value,r=reward.value;if(!t||!r)return alert('Fill');let a=getTasks();a.push({id:Date.now(),title:t,reward:parseInt(r)});saveTasks(a);title.value='';reward.value=''}function del(id){saveTasks(getTasks().filter(x=>x.id!=id))}function show(){let a=getTasks();list.innerHTML=a.map(x=>`<div style="background:#eef;padding:10px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between"><span>${x.title} - ${x.reward} UGX</span><span onclick="del(${x.id})" style="color:red">❌</span></div>`).join('')||'No tasks'}show()</script></body></html>
