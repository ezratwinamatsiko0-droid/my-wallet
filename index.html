<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ezol Daily Tasks - My Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;max-width:400px;margin:20px auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1877f2;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
h2{text-align:center;color:#1877f2}
.task{background:#f9f9f9;padding:12px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between}
.balance{font-size:24px;text-align:center;font-weight:bold;color:green}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="authCard">
<h2>Ezol Wallet Login</h2>
<input id="phone" placeholder="Phone number e.g 077...">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()" style="background:#42b72a">Create Account</button>
<p id="msg" style="text-align:center;color:red"></p>
</div>
<div class="card hidden" id="dashCard">
<h2>My Wallet</h2>
<p style="text-align:center">Welcome: <span id="userPhone"></span></p>
<div class="balance">UGX <span id="bal">0</span></div>
<button onclick="loadTasks()">My Daily Tasks</button>
<div id="tasks"></div>
<button onclick="logout()" style="background:#888">Logout</button>
</div>
<script>
async function register(){
 let phone=document.getElementById('phone').value.trim();
 let pass=document.getElementById('password').value.trim();
 if(!phone||!pass){document.getElementById('msg').innerText="Enter phone & password";return}
 const {data,error}=await supabaseClient.from('users').insert([{phone:phone,password:pass,balance:0}]);
 if(error){document.getElementById('msg').innerText=error.message; if(error.message.includes('duplicate')) document.getElementById('msg').innerText="User already exists, Login"; }
 else {document.getElementById('msg').style.color='green';document.getElementById('msg').innerText="Account created! Now Login";}
}
async function login(){
 let phone=document.getElementById('phone').value.trim();
 let pass=document.getElementById('password').value.trim();
 const {data,error}=await supabaseClient.from('users').select('*').eq('phone',phone).eq('password',pass).single();
 if(error||!data){document.getElementById('msg').innerText="Wrong phone or password";return}
 localStorage.setItem('ezol_user',JSON.stringify(data));
 showDash(data);
}
function showDash(user){
 document.getElementById('authCard').classList.add('hidden');
 document.getElementById('dashCard').classList.remove('hidden');
 document.getElementById('userPhone').innerText=user.phone;
 document.getElementById('bal').innerText=user.balance||0;
}
function logout(){localStorage.removeItem('ezol_user');location.reload();}
async function loadTasks(){
 document.getElementById('tasks').innerHTML="Loading tasks...";
 const {data}=await supabaseClient.from('tasks').select('*').limit(10);
 if(!data||data.length==0){document.getElementById('tasks').innerHTML="<p>No tasks yet. Admin will add.</p>";return}
 let html="";
 data.forEach(t=>{html+=`<div class='task'><span>${t.title||t.name}</span><span>UGX ${t.reward||0}</span></div>`});
 document.getElementById('tasks').innerHTML=html;
}
const saved=localStorage.getItem('ezol_user');
if(saved){showDash(JSON.parse(saved));}
</script>
</body>
</html>
