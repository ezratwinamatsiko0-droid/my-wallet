<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ezol Wallet V8 Firebase</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#d946ef,#a21caf);min-height:100vh;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}.balance{background:linear-gradient(135deg,#581c87,#7e22ce);color:#fff;text-align:center;padding:20px;border-radius:20px}
.btn{padding:12px;border:none;border-radius:12px;font-weight:700;width:100%;cursor:pointer}.task{display:flex;justify-content:space-between;align-items:center;background:#f3f4f6;padding:10px;border-radius:12px;margin:6px 0}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#581c87,#d946ef);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-top:8px}
#waCare{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:9999;cursor:pointer}
</style></head><body>
<div id="loginScreen"><div class="card" style="width:100%;max-width:360px;text-align:center">
<h2 style="color:#7e22ce">🇺🇬 EZOL WALLET V8</h2><p id="inviteInfo" style="font-size:11px;background:#fef3c7;padding:6px;border-radius:8px;display:none"></p>
<div style="display:flex;gap:6px"><button id="tL" onclick="sw('l')" style="flex:1;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:8px">Login</button><button id="tR" onclick="sw('r')" style="flex:1;padding:10px;background:#e5e7eb;border:none;border-radius:8px">Register</button></div>
<div id="fL"><input id="lP" placeholder="Phone 076..."><input id="lPa" type="password" placeholder="Password"><button onclick="login()" class="btn" style="background:#7c3aed;color:#fff;margin-top:10px">Login</button></div>
<div id="fR" style="display:none"><input id="rN" placeholder="Full Name"><input id="rP" placeholder="Phone"><input id="rPa" type="password" placeholder="Password min 4"><input id="rPa2" type="password" placeholder="Confirm"><button onclick="reg()" class="btn" style="background:#22c55e;color:#fff;margin-top:10px">Create Account</button></div>
</div></div>

<div class="balance card"><div>Total Balance</div><h1><span id="bal">0</span> UGX</h1><div id="ph" style="font-size:12px"></div><span onclick="logout()" style="font-size:10px;text-decoration:underline;cursor:pointer">Logout</span></div>
<div class="card" style="border:2px dashed #3b82f6"><h3 style="margin:0">👥 Invite & Earn 500</h3><p>Your Code: <b id="myRef"></b> | Invited: <span id="rc">0</span></p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button onclick="share('wa')" style="padding:10px;background:#25D366;color:#fff;border:none;border-radius:10px">WhatsApp</button><button onclick="share('fb')" style="padding:10px;background:#1877F2;color:#fff;border:none;border-radius:10px">Facebook</button></div></div>
<div class="card"><h3>💰 Tasks</h3><div id="tList"></div></div>
<div class="card" style="border:2px solid #22c55e"><h3>💵 Withdraw</h3><input id="wA" type="number" placeholder="Amount"><button onclick="wd()" class="btn" style="background:#22c55e;color:#fff;margin-top:6px">Withdraw via WhatsApp</button></div>
<div id="waCare" onclick="care()">💬</div>

<script>
// ==== REPLACE WITH YOUR FIREBASE CONFIG ====
const firebaseConfig = {
  apiKey: "AIzaSyD-XXXX-REPLACE-ME",
  authDomain: "ezol-wallet.firebaseapp.com",
  projectId: "ezol-wallet",
  storageBucket: "ezol-wallet.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
// ==========================================
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let cur=null, curData=null;
let TASKS=[
 {title:"Join WhatsApp Channel",reward:500,link:"https://whatsapp.com/channel/0029Vb6h2X6J3jvqU0Q9Zg0z"},
 {title:"Follow TikTok",reward:500,link:"https://tiktok.com"},
 {title:"Follow Facebook",reward:500,link:"https://facebook.com"},
 {title:"YouTube Subscribe",reward:500,link:"https://youtube.com"},
 {title:"Instagram Follow",reward:500,link:"https://instagram.com"},
 {title:"Invite Friend",reward:500,link:"whatsapp://"}
];
function sw(t){document.getElementById('fL').style.display=t=='l'?'block':'none';document.getElementById('fR').style.display=t=='r'?'block':'none';document.getElementById('tL').style.background=t=='l'?'#7c3aed':'#e5e7eb';document.getElementById('tR').style.background=t=='r'?'#22c55e':'#e5e7eb';}
async function reg(){
 let n=document.getElementById('rN').value.trim(), p=document.getElementById('rP').value.trim(), a=document.getElementById('rPa').value, b=document.getElementById('rPa2').value;
 if(!n||p.length<9) return alert('Name & phone required'); if(a.length<4) return alert('Pass min 4'); if(a!=b) return alert('Pass mismatch');
 let ref=new URLSearchParams(location.search).get('ref');
 let docRef=db.collection('users').doc(p); let snap=await docRef.get(); if(snap.exists) return alert('Phone exists, login!');
 let data={name:n,phone:p,pass:a,balance:0,refs:0,joined:new Date().toISOString(),done:[]};
 await docRef.set(data);
 if(ref && ref!=p){ let rRef=db.collection('users').doc(ref); let rSnap=await rRef.get(); if(rSnap.exists){ await rRef.update({balance: firebase.firestore.FieldValue.increment(500), refs: firebase.firestore.FieldValue.increment(1)}); } }
 localStorage.setItem('ezol_cur',p); location.href=location.pathname;
}
async function login(){
 let p=document.getElementById('lP').value.trim(), pa=document.getElementById('lPa').value;
 let snap=await db.collection('users').doc(p).get(); if(!snap.exists) return alert('Not found, register'); if(snap.data().pass!=pa) return alert('Wrong pass');
 localStorage.setItem('ezol_cur',p); location.href=location.pathname;
}
async function check(){
 cur=localStorage.getItem('ezol_cur'); let ref=new URLSearchParams(location.search).get('ref');
 if(ref){document.getElementById('inviteInfo').style.display='block';document.getElementById('inviteInfo').innerHTML='🎉 Invited by '+ref;}
 if(!cur){document.getElementById('loginScreen').style.display='flex'; return;}
 document.getElementById('loginScreen').style.display='none';
 let snap=await db.collection('users').doc(cur).get(); if(!snap.exists){logout(); return;} curData=snap.data();
 document.getElementById('bal').innerText=curData.balance||0; document.getElementById('ph').innerText=curData.phone+' | '+curData.name; document.getElementById('myRef').innerText=curData.phone; document.getElementById('rc').innerText=curData.refs||0;
 document.getElementById('tList').innerHTML=TASKS.map((t,i)=>{let d=(curData.done||[]).includes(i); return `<div class="task"><div><b>${t.title}</b><br><small>${t.reward} UGX</small></div><button ${d?'disabled':''} onclick="doT(${i})" style="background:${d?'#9ca3af':'#7c3aed'};color:#fff;border:none;padding:8px 12px;border-radius:8px">${d?'Done':'Do Task'}</button></div>`}).join('');
}
async function doT(i){ if((curData.done||[]).includes(i)) return; let t=TASKS[i]; try{window.open(t.link,'_blank');}catch(e){}
 let newDone=[...(curData.done||[]),i]; await db.collection('users').doc(cur).update({done:newDone,balance: firebase.firestore.FieldValue.increment(t.reward)}); check(); alert('Earned '+t.reward+'!');
}
function logout(){localStorage.removeItem('ezol_cur');location.reload();}
function share(t){let url=`https://ezratwinamatsiko0-droid.github.io/my-wallet/?ref=${cur}`; if(t=='wa') window.open('https://wa.me/?text='+encodeURIComponent('EZOL WALLET 🇺🇬 Earn 500! '+url),'_blank'); else window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank');}
function wd(){let a=parseInt(document.getElementById('wA').value); if(!a||a<500) return alert('Min 500'); if(a>(curData.balance||0)) return alert('Low bal'); db.collection('users').doc(cur).update({balance: firebase.firestore.FieldValue.increment(-a)}); let wa=localStorage.getItem('ezol_wa')||'256795143386'; window.open('https://wa.me/'+wa+'?text=*WITHDRAW* '+cur+' '+a,'_blank'); setTimeout(check,1000);}
function care(){let wa=localStorage.getItem('ezol_wa')||'256795143386'; window.open('https://wa.me/'+wa+'?text=Help '+cur,'_blank');}
check();
</script></body></html>
