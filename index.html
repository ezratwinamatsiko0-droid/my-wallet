<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ezol Wallet - Earn Daily</title><style>body{font-family:Arial;background:#f0f4ff;margin:0;padding:12px}.card{background:white;padding:18px;border-radius:15px;max-width:420px;margin:15px auto;box-shadow:0 4px 15px rgba(0,0,0,0.08)}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}.task{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;margin:8px 0;border-radius:12px}.balance{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:18px;border-radius:15px;text-align:center}.hidden{display:none}.row{display:flex;gap:8px}.row button{flex:1}</style></head><body><div id="loginPage" class="card"><h2 style="color:#2563eb;text-align:center">Ezol Earn Wallet 💰</h2><input id="phone" placeholder="Phone 077..."><input id="pass" type="password" placeholder="Password"><input id="refInput" placeholder="Referral code (optional)"><button onclick="signup()">Create Account</button><button onclick="login()" style="background:#0f172a">Login</button><p style="text-align:center;font-size:12px;color:gray">Earn UGX by completing tasks daily</p></div><div id="mainPage" class="card hidden"><div class="balance"><p style="margin:0;opacity:0.9">Welcome</p><h3 id="userPhone" style="margin:4px 0"></h3><h1 id="bal">UGX 0</h1><small>Balance</small></div><div style="background:#fffbeb;border:1px dashed #f59e0b;padding:10px;border-radius:10px;margin:12px 0;text-align:center"><small>Your Referral Code:</small><br><b id="myRef" style="font-size:18px;color:#d97706"></b><br><small>Share & earn 500 UGX per friend</small></div><h3>📋 Daily Tasks</h3><div id="taskList"></div><div style="margin-top:15px"><button onclick="withdraw()" style="background:#25D366">📱 Withdraw via WhatsApp</button><small style="display:block;text-align:center;margin-top:5px">Min withdraw 5000 UGX</small></div><button onclick="logout()" style="background:#ef4444;margin-top:12px">Logout</button><p style="text-align:center;font-size:11px"><a href="admin.html">Admin</a></p></div><script>let currentUser=null;function getUsers(){return JSON.parse(localStorage.getItem('ezol_users')||'{}')}function saveUsers(u){localStorage.setItem('ezol_users',JSON.stringify(u))}function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function getCompleted(){return JSON.parse(localStorage.getItem('ezol_completed_'+currentUser)||'[]')}function getWa(){return localStorage.getItem('ezol_wa')||'256000000000'}function signup(){let p=phone.value.trim(),pw=pass.value.trim(),ref=refInput.value.trim();if(!p||!pw)return alert('Phone & password');let u=getUsers();if(u[p])return alert('Account exists, login');u[p]={password:pw,balance:0,refBy:ref||null};saveUsers(u);if(ref&&u[ref]){u[ref].balance=(u[ref].balance||0)+500;saveUsers(u);}alert('Account created! Login now. '+ (ref?'Referral bonus given!':''))}function login(){let p=phone.value.trim(),pw=pass.value.trim(),u=getUsers();if(!u[p]||u[p].password!=pw)return alert('Wrong');currentUser=p;localStorage.setItem('ezol_current',p);showMain()}function showMain(){loginPage.classList.add('hidden');mainPage.classList.remove('hidden');userPhone.innerText=currentUser;myRef.innerText=currentUser;let u=getUsers();bal.innerText='UGX '+(u[currentUser].balance||0);renderTasks()}function renderTasks(){let tasks=getTasks(),done=getCompleted(),h='';if(!tasks.length)h='<p style="color:gray;text-align:center">No tasks yet. Check later.</p>';tasks.forEach(t=>{let d=done.includes(t.id);h+=`<div class="task"><div style="display:flex;justify-content:space-between"><div><b>${t.title}</b><br><small style="color:green;font-weight:bold">${t.reward} UGX</small></div><span style="color:${d?'green':'orange'}">${d?'✓ Done':'⏳'}</span></div>${t.link?`<a href="${t.link}" target="_blank" style="display:block;margin:8px 0;color:#2563eb;font-size:13px">🔗 Open Task Link</a>`:''}<button onclick="completeTask(${t.id},${t.reward})" style="background:${d?'#9ca3af':'#22c55e'};padding:8px" ${d?'disabled':''}>${d?'Completed':'Complete & Earn ${t.reward} UGX'}</button></div>`});taskList.innerHTML=h}function completeTask(id,r){let c=getCompleted();if(c.includes(id))return;c.push(id);localStorage.setItem('ezol_completed_'+currentUser,JSON.stringify(c));let u=getUsers();u[currentUser].balance=(u[currentUser].balance||0)+r;saveUsers(u);bal.innerText='UGX '+u[currentUser].balance;renderTasks();alert('🎉 Earned '+r+' UGX!')}function withdraw(){let u=getUsers();let b=u[currentUser].balance||0;if(b<5000)return alert('Min 5000 UGX to withdraw. Balance: '+b);let wa=getWa();let msg=encodeURIComponent(`Hello Ezol Admin, I want to withdraw.\nPhone: ${currentUser}\nAmount: UGX ${b}\nPlease pay me.`);window.open(`https://wa.me/${wa}?text=${msg}`,'_blank')}function logout(){localStorage.removeItem('ezol_current');location.reload()}window.onload=()=>{let c=localStorage.getItem('ezol_current');if(c){currentUser=c;showMain()}}</script></body></html>
