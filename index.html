<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ezol Wallet</title><style>body{font-family:Arial;background:#f0f4ff;margin:0;padding:15px}.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:20px auto}input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;padding:13px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.task{background:#f8fafc;border:1px solid #e2e8f0;padding:15px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.balance{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:20px;border-radius:15px;text-align:center}.hidden{display:none}</style></head><body><div id="loginPage" class="card"><h2 style="color:#2563eb;text-align:center">Ezol Wallet</h2><input id="phone" placeholder="Phone 077..."><input id="pass" type="password" placeholder="Password"><button onclick="signup()">Create Account</button><button onclick="login()" style="background:#0f172a">Login</button></div><div id="mainPage" class="card hidden"><div class="balance"><p style="margin:0">Welcome</p><h3 id="userPhone" style="margin:5px 0"></h3><h1 id="bal">UGX 0</h1></div><h3>📋 My Daily Tasks</h3><div id="taskList"></div><button onclick="logout()" style="background:#ef4444;margin-top:20px">Logout</button><p style="text-align:center"><a href="admin.html">Admin Panel</a></p></div><script>let currentUser=null;function getUsers(){return JSON.parse(localStorage.getItem('ezol_users')||'{}')}function saveUsers(u){localStorage.setItem('ezol_users',JSON.stringify(u))}function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function getCompleted(){return JSON.parse(localStorage.getItem('ezol_completed_'+currentUser)||'[]')}function signup(){let p=phone.value.trim(),pw=pass.value.trim();if(!p||!pw)return alert('Enter phone & password');let u=getUsers();if(u[p])return alert('Exists, Login');u[p]={password:pw,balance:0};saveUsers(u);alert('Created! Login now')}function login(){let p=phone.value.trim(),pw=pass.value.trim(),u=getUsers();if(!u[p]||u[p].password!=pw)return alert('Wrong phone or password');currentUser=p;localStorage.setItem('ezol_current',p);showMain()}function showMain(){loginPage.classList.add('hidden');mainPage.classList.remove('hidden');userPhone.innerText=currentUser;bal.innerText='UGX '+(getUsers()[currentUser].balance||0);renderTasks()}function renderTasks(){let tasks=getTasks(),done=getCompleted(),h='';if(!tasks.length)h='<p style="color:gray;text-align:center">No tasks yet. Admin will add.</p>';tasks.forEach(t=>{let d=done.includes(t.id);h+=`<div class="task"><div><b>${t.title}</b><br><small style="color:green">${t.reward} UGX</small></div><button onclick="completeTask(${t.id},${t.reward})" style="width:auto;padding:8px 15px;background:${d?'gray':'#22c55e'}" ${d?'disabled':''}>${d?'Done ✓':'Do'}</button></div>`});taskList.innerHTML=h}function completeTask(id,r){let c=getCompleted();if(c.includes(id))return;c.push(id);localStorage.setItem('ezol_completed_'+currentUser,JSON.stringify(c));let u=getUsers();u[currentUser].balance=(u[currentUser].balance||0)+r;saveUsers(u);bal.innerText='UGX '+u[currentUser].balance;renderTasks();alert('You earned '+r+' UGX!')}function logout(){localStorage.removeItem('ezol_current');location.reload()}window.onload=()=>{let c=localStorage.getItem('ezol_current');if(c){currentUser=c;showMain()}}</script></body></html>
