// In index.html, inside <script type="module"> find doRegister and replace with this:
window.doRegister=async function(){
  var n=document.getElementById('regName').value.trim();
  var p=document.getElementById('regPhone').value.trim();
  var pa=document.getElementById('regPass').value.trim();
  if(n.length<3||p.length<10||pa.length<4){alert("Fill all");return;}
  user={name:n,phone:p,password:pa,balance:500,vipLevel:0};
  localStorage.setItem('ezol_user',JSON.stringify(user));
  localStorage.setItem('ezol_balance','500');
  try{
    const { doc, setDoc, serverTimestamp } = firestoreFns;
    await setDoc(doc(db,"users",p),{name:n,phone:p,password:pa,balance:500,vipLevel:0,refBy:document.getElementById('refDisplay').innerText,createdAt:serverTimestamp()});
  }catch(e){console.log(e)}
  alert("Welcome "+n+"! You are now visible in CEO ADMIN automatically!");
  location.reload();
}
