<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ezol - Earn Daily</title><style>body{font-family:Arial;background:#eef2ff;margin:0;padding:12px}.card{background:white;padding:18px;border-radius:18px;max-width:420px;margin:15px auto;box-shadow:0 8px 25px rgba(0,0,0,0.1)}.balance{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:18px;border-radius:16px;text-align:center}.task{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;margin:8px 0;border-radius:12px}.hidden{display:none}button{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;border:none;border-radius:10px;font-weight:800;margin-top:8px}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}</style></head><body><div id="loginPage" class="card"><div style="text-align:center"><div style="width:60px;height:60px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:15px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:white">💼</div><h1 style="margin:5px">Ezol</h1><small style="color:gray">Earn Daily UGX Uganda</small></div><input id="phone" placeholder="Phone 077..."><input id="pass" type="password" placeholder="Password"><input id="refInput" placeholder="Referral (optional)"><button onclick="signup()">Create Account</button><button onclick="login()" style="background:#0f172a">Login</button></div><div id="mainPage" class="card hidden"><div class="balance"><p style="margin:0;font-size:12px">Welcome</p><h3 id="userPhone" style="margin:3px 0;font-size:14px"></h3><h1 id="bal">UGX 0</h1><small>Balance</small></div><div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;margin:12px 0;text-align:center"><b>🎁 Daily Check-in</b><br><button onclick="dailyBonus()" id="bonusBtn" style="background:#22c55e;padding:8px;margin-top:6px">Claim 200 UGX Today</button><small id="bonusMsg" style="display:block;margin-top:4px;color:gray"></small></div><div style="background:#fffbeb;border:1px dashed #f59e0b;padding:10px;border-radius:10px;text-align:center"><small>Your Referral Code:</small><br><b id="myRef" style="font-size:18px;color:#b45309"></b><br><small>500 UGX per friend</small></div><h3>📋 Daily Tasks</h3><div id="taskList"></div><button onclick="withdraw()" style="background:#25D366">📱 Withdraw via WhatsApp</button><small style="display:block;text-align:center;color:gray">Min 5000 UGX</small><button onclick="logout()" style="background:#f1f5f9;color:gray">Logout</button><p style="text-align:center;font-size:11px"><a href="admin.html">Admin</a></p></div><script>let currentUser=null;function getUsers(){return JSON.parse(localStorage.getItem('ezol_users')||'{}')}function saveUsers(u){localStorage.setItem('ezol_users',JSON.stringify(u))}function getTasks(){return JSON.parse(localStorage.getItem('ezol_tasks')||'[]')}function getCompleted(){return JSON.parse(localStorage.getItem('ezol_completed_'+currentUser)||'[]')}function getWa(){return localStorage.getItem('ezol_wa')||'256795143386'}function signup(){let p=phone.value.trim(),pw=pass.value.trim(),ref=refInput.value.trim();if(!p||!pw)return alert('Enter details');let u=getUsers();if(u[p])return alert('Exists');u[p]={password:pw,balance:0};saveUsers(u);if(ref&&u[ref]){u[ref].balance=(u[ref].balance||0)+500;saveUsers(u);}alert('Created! Login')}function login(){let p=phone.value.trim(),pw=pass.value.trim(),u=getUsers();if(!u[p]||u[p].password!=pw)return alert('Wrong');currentUser=p;localStorage.setItem('ezol_current',p);showMain()}function showMain(){loginPage.classList.add('hidden');mainPage.classList.remove('hidden');userPhone.innerText=currentUser;myRef.innerText=currentUser;bal.innerText='UGX '+(getUsers()[currentUser].balance||0);renderTasks();checkBonus()}function renderTasks(){let tasks=getTasks(),done=getCompleted(),h='';if(!tasks.length)h='<p style="text-align:center;color:gray">No tasks</p>';tasks.forEach(t=>{let d=done.includes(t.id);h+=`<div class="task"><div style="display:flex;justify-content:space-between"><b>${t.title}</b><span style="color:${d?'green':'orange'}">${d?'✓ Done':'○'}</span></div><small style="color:green">${t.reward} UGX</small>${t.link?`<br><a href="${t.link}" target="_blank" style="color:#2563eb;font-size:13px">🔗 Open Link</a>`:''}<br><button onclick="completeTask(${t.id},${t.reward})" style="background:${d?'#ccc':'#22c55e'};padding:8px;margin-top:6px" ${d?'disabled':''}>${d?'Completed':'Complete'}</button></div>`});taskList.innerHTML=h}function completeTask(id,r){let c=getCompleted();if(c.includes(id))return;c.push(id);localStorage.setItem('ezol_completed_'+currentUser,JSON.stringify(c));let u=getUsers();u[currentUser].balance+=r;saveUsers(u);bal.innerText='UGX '+u[currentUser].balance;renderTasks();alert('Earned '+r)}function dailyBonus(){let last=localStorage.getItem('ezol_bonus_'+currentUser);let today=new Date().toDateString();if(last==today)return alert('Already claimed today!');let u=getUsers();u[currentUser].balance=(u[currentUser].balance||0)+200;saveUsers(u);localStorage.setItem('ezol_bonus_'+currentUser,today);bal.innerText='UGX '+u[currentUser].balance;checkBonus();alert('🎉 +200 UGX daily bonus!')}function checkBonus(){let last=localStorage.getItem('ezol_bonus_'+currentUser);let today=new Date().toDateString();if(last==today){bonusBtn.innerText='✓ Claimed Today';bonusBtn.disabled=true;bonusBtn.style.background='#ccc';bonusMsg.innerText='Come back tomorrow'}else{bonusBtn.innerText='Claim 200 UGX Today';bonusBtn.disabled=false}}function withdraw(){let b=getUsers()[currentUser].balance||0;if(b<5000)return alert('Min 5000, you have '+b);let wa=getWa();window.open(`https://wa.me/${wa}?text=${encodeURIComponent(`Hello Ezol, withdraw\nPhone: ${currentUser}\nAmount: ${b} UGX`)}`)}function logout(){localStorage.removeItem('ezol_current');location.reload()}window.onload=()=>{let c=localStorage.getItem('ezol_current');if(c){currentUser=c;showMain()}}</script></body></html>
